# Keyless assembled-request snapshot for native Nulu image offload. The
# local provider endpoint is supplied by the snapshot test; the real attachment
# store and ACP bridge carry two uploaded images into one model request.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  config:
    protocol: !!js process.env.DSH_SNAPSHOT_PROTOCOL
    apiKeyEnv: DSH_SNAPSHOT_API_KEY
    baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
    thinking: disabled
    maxRequestFilesBytes: 92
    imageOffloadByteQuantum: 1
    models:
      - id: nulu-5-vision
        contextWindow: 32768
        maxTokens: 1024
        inputModalities: [text, image]

- id: acp
  name: '@worldapptechnologies/nulu-acp'
  config:
    provider: worldapp-gateway
    model: nulu-5-vision

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js process.env.NULU_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    compression: none

- id: agent-instructions
  name: '@worldapptechnologies/nulu-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Keep answers brief and factual.

- id: attachment-local
  name: '@worldapptechnologies/nulu-attachment-local'
