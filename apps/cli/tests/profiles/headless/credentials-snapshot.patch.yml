# Missing-credential patch over the shipped headless profile. The replacement
# adapter registers the production route but cannot reach its endpoint.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-gateway
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: worldapp-gateway
        model: nulu-5
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-gateway-keyless
      name: '@worldapptechnologies/nulu-llm-gateway'
      config:
        baseURL: 'http://127.0.0.1:9'
