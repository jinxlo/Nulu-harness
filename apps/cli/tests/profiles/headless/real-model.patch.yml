# Test-only agent and persistence patch over the shipped base + headless
# profile. The shared driver owns the turn, so the product runner stays off.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-gateway
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: nulu-5-ultra
        contextWindow: 128000
      - id: nulu-5
        contextWindow: 128000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: worldapp-gateway
        model: nulu-5
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: !!js "process.env.NULU_SNAPSHOT === undefined ? 'zstd' : 'none'"
