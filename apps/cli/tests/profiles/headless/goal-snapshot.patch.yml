# Replay-backed goal patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-gateway
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: worldapp-gateway
        model: nulu-5
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'

- id: session-log-deepseek
  config:
    enabled: false
