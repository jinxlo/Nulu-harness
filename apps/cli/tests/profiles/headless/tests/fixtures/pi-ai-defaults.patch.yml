# pi-ai route and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-gateway
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      nulu:
        apiKeyEnv: WORLD_APP_TECHNOLOGIES_API_KEY
        baseURL: !!js process.env.NULU_SNAPSHOT_BASE_URL
        reasoning: low
        modelOverrides:
          nulu-5:
            maxTokens: 1024
        streamIdleTimeoutMs: 1000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: nulu
        model: nulu-5
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
