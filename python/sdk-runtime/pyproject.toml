[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "nulu-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled nulu CLI runtime for the Nulu Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "World App Technologies" }]

[project.urls]
Homepage = "https://github.com/worldapptechnologies/nulu-harness"
Documentation = "https://github.com/worldapptechnologies/nulu-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/worldapptechnologies/nulu-harness/issues"
Source = "https://github.com/worldapptechnologies/nulu-harness"

[project.scripts]
nulu = "nulu_harness_runtime:main"

# Include the injected nulu executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/nulu_harness_runtime/runtime/nulu-harness-sdk-runtime-*"]
exclude = ["src/nulu_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/nulu_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
