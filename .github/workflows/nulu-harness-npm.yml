name: nulu-harness npm package

# Packs the release exactly as it would be published, installs it with
# `npm install -g nulu-harness` on Linux, macOS and Windows from a registry
# that exists only inside each job, and runs the installed command. Publishing
# is a separate, explicit dispatch from a nulu-v* tag and waits for the
# npm-publish environment.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked packages to npm (requires a nulu-v* tag and the npm-publish environment)
        type: boolean
        default: false
      resume_from_run:
        description: Resume publishing the artifact of an earlier tagged run whose pack and install jobs passed (run id)
        type: string
        default: ''

concurrency:
  group: nulu-harness-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NULU_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack the release
    if: inputs.resume_from_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify release version
        env:
          RELEASE_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: pnpm run release:verify --family nulu
      - run: pnpm run build:official
      - run: pnpm run release:pack --family nulu --out dist/npm --concurrency 8
      - run: node scripts/automation/pack-distribution.mjs dist/npm-wrapper dist/npm
      - uses: actions/upload-artifact@v7
        with:
          name: nulu-harness-npm
          path: dist/npm-wrapper/
          if-no-files-found: error
          retention-days: 14

  install:
    name: Install and run on ${{ matrix.runner }}
    needs: pack
    if: inputs.resume_from_run == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: nulu-harness-npm
          path: dist/npm-wrapper
      - name: npm install -g nulu-harness, then run the installed command
        env:
          WORLD_APP_TECHNOLOGIES_API_KEY: ${{ secrets.WORLD_APP_TECHNOLOGIES_API_KEY_EXTERNAL }}
        run: node scripts/automation/cli-install-check.mjs dist/npm-wrapper/nulu-harness-${{ needs.pack.outputs.version }}.tgz evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cli-install-${{ matrix.runner }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish to npm
    # A resumed run publishes the package an earlier tagged run packed and installed on every platform.
    if: always() && inputs.publish && (inputs.resume_from_run != '' || (needs.pack.result == 'success' && needs.install.result == 'success'))
    needs: [pack, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the run being resumed
        if: inputs.resume_from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.resume_from_run }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          [ "$(jq -r .path <<<"$run")" = ".github/workflows/nulu-harness-npm.yml" ] || { echo "Run $RUN_ID is not a run of this workflow"; exit 1; }
          [[ "$(jq -r .head_branch <<<"$run")" == nulu-v* ]] || { echo "Run $RUN_ID was not started from a nulu-v* tag"; exit 1; }
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=50")
          passed=$(jq '[.jobs[] | select((.name == "Pack the release" or (.name | startswith("Install and run on "))) and .conclusion == "success")] | length' <<<"$jobs")
          [ "$passed" = 5 ] || { echo "Run $RUN_ID did not pack and install on all four platforms ($passed of 5 jobs passed)"; exit 1; }
          echo "Resuming the artifact of run $RUN_ID from $(jq -r .head_branch <<<"$run")"
      - uses: actions/download-artifact@v8
        with:
          name: nulu-harness-npm
          path: dist/npm-wrapper
          run-id: ${{ inputs.resume_from_run || github.run_id }}
          github-token: ${{ github.token }}
      # nulu-harness carries every Nulu Harness package, so one publication releases the version.
      - name: Publish nulu-harness
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball=$(ls dist/npm-wrapper/nulu-harness-*.tgz)
          version=$(sed -n 's/^.*nulu-harness-\(.*\)\.tgz$/\1/p' <<<"$tarball")
          if npm view "nulu-harness@$version" version >/dev/null 2>&1; then echo "nulu-harness@$version is already published"; exit 0; fi
          npm publish "$tarball"
