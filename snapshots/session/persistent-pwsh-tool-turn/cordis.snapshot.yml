# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-deepseek
  name: '@worldapptechnologies/nulu-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- insert:
    - id: terminal
      name: '@worldapptechnologies/nulu-terminal'

- id: sandbox-policy
  name: '@worldapptechnologies/nulu-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@worldapptechnologies/nulu-subprocess-local'

- insert:
    - id: terminal-pwsh
      name: '@worldapptechnologies/nulu-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@worldapptechnologies/nulu-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@worldapptechnologies/nulu-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@worldapptechnologies/nulu-tool-jobs'
  disabled: true

- id: goal
  name: '@worldapptechnologies/nulu-goal'
  disabled: true

- id: goal-round-driver
  name: '@worldapptechnologies/nulu-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@worldapptechnologies/nulu-command-goal'
  disabled: true

- id: tool-goal
  name: '@worldapptechnologies/nulu-tool-goal'
  disabled: true

- id: skill
  name: '@worldapptechnologies/nulu-skill'
  disabled: true

- id: skill-filesystem
  name: '@worldapptechnologies/nulu-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@worldapptechnologies/nulu-tool-skill'
  disabled: true

- id: tool-bash
  name: '@worldapptechnologies/nulu-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@worldapptechnologies/nulu-tool-pwsh-persistent'
