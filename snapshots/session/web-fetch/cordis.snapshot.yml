# Keyless replay counterpart: deterministic HTTP remains real; only the model
# adapter is replaced by replay.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra

    - id: web-fetch-fixture
      name: './web-fetch-fixture-server.mjs'

- id: web
  name: '@worldapptechnologies/nulu-web'

- id: web-fetch-http
  name: '@worldapptechnologies/nulu-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@worldapptechnologies/nulu-tool-web'
  config:
    search: false
