# Keyless twin of subagent-acp-diagnostic.cordis.yml: keep the real ACP child
# permission-denial path and replace only the external parent model adapter.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- insert:
    - id: acp-diagnostic-release-on-job-output
      name: './release-on-job-output.mjs'
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra
    - id: subagent-acp-diagnostic
      name: '@worldapptechnologies/nulu-subagent-acp'
      config:
        providerName: acp-diagnostic
        command: !!js process.execPath
        args:
          - !!js "decodeURIComponent(new URL('../../../packages/subagent/subagent-acp/tests/mock-acp-server.ts', 'file://' + process.env.NULU_SNAPSHOT_FILE).pathname)"
        permission: reject
        env:
          MOCK_PERMISSION: '1'
          MOCK_TOOL_KIND: execute
          MOCK_PROMPT_HOLD: .nulu/acp-diagnostic-prompt-hold
    - id: tool-subagent-acp-diagnostic
      name: '@worldapptechnologies/nulu-tool-subagent'
      config:
        provider: acp-diagnostic
        toolName: subagent_acp
        backgroundMode: one-shot
        maxDepth: provider-managed
