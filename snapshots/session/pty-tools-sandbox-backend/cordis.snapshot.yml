# Keyless replay counterpart to pty.cordis.yml.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- insert:
    - id: pty
      name: '@worldapptechnologies/nulu-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@worldapptechnologies/nulu-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra
