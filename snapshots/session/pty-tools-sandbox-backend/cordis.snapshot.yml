# Keyless replay counterpart to pty.cordis.yml.
- id: llm-deepseek
  name: '@worldapptechnologies/nulu-llm-deepseek'
  disabled: true

- insert:
    - id: pty
      name: '@worldapptechnologies/nulu-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@worldapptechnologies/nulu-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
