# Keyless session-query snapshot patch: replay plus the filesystem spill
# settings inherited by this scenario. The ACP row re-pins the recorded flash model.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: agent-default-model
  name: '@worldapptechnologies/nulu-agent-default-model'
  config:
    provider: worldapp-gateway
    model: nulu-5

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@worldapptechnologies/nulu-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra

- id: spill-local
  name: '@worldapptechnologies/nulu-spill-local'
  config:
    root: !!js process.env.NULU_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@worldapptechnologies/nulu-spill-policy'
  config:
    maxInlineBytes: 800

# Keyless counterpart to session-query.cordis.yml: the nested snapshot overlay
# supplies replay plus deterministic private spill storage and its byte limit.
- insert:
    - id: tool-session-query
      name: '@worldapptechnologies/nulu-tool-session-query'

- id: timeout-policy
  name: '@worldapptechnologies/nulu-tool-call-timeout-policy'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.NULU_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.NULU_SNAPSHOT_SPILL_LOCATOR_ROOT

- insert:
    - id: query-spill-verification-path
      name: ./resolve-spill-command.mjs
