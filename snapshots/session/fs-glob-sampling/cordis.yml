# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  config:
    models:
      - id: nulu-5-ultra

- id: subprocess
  name: '@worldapptechnologies/nulu-subprocess-local'

- id: agent-default-model
  name: '@worldapptechnologies/nulu-agent-default-model'
  config:
    provider: worldapp-gateway
    model: nulu-5-ultra

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: !!js 'process.env.NULU_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@worldapptechnologies/nulu-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@worldapptechnologies/nulu-tool-jobs'
  disabled: true

- id: goal
  name: '@worldapptechnologies/nulu-goal'
  disabled: true

- id: goal-round-driver
  name: '@worldapptechnologies/nulu-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@worldapptechnologies/nulu-command-goal'
  disabled: true

- id: tool-goal
  name: '@worldapptechnologies/nulu-tool-goal'
  disabled: true

- id: skill
  name: '@worldapptechnologies/nulu-skill'
  disabled: true

- id: skill-filesystem
  name: '@worldapptechnologies/nulu-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@worldapptechnologies/nulu-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@worldapptechnologies/nulu-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@worldapptechnologies/nulu-spill-local'
  config:
    root: !!js process.env.NULU_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.NULU_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.NULU_SNAPSHOT_SPILL_LOCATOR_ROOT
