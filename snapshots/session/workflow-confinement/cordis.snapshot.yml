# Replay the authored model turns through the shipped OS sandbox.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: plugin-package-inventory
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: nulu-official
            name: Nulu
            models:
              - id: nulu-v4-flash
              - id: nulu-v4-pro
