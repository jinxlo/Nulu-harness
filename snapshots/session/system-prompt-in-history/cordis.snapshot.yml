# Keyless replay counterpart of system-prompt-in-history/cordis.yml: the
# replay route declares the same in-history capability.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: agent-default-model
  name: '@worldapptechnologies/nulu-agent-default-model'
  config:
    provider: worldapp-gateway
    model: nulu-5

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
                systemPromptUpdate: in-history
                inputModalities: [text, image]
    - id: in-history-prompt-update
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/in-history-prompt-update.ts'
