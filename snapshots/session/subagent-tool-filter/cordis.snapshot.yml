# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: plugin-package-inventory
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- id: sandbox
  name: '@worldapptechnologies/nulu-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra

# Restrict inherited capabilities before the child assembles its first request.
- id: tool-subagent
  name: '@worldapptechnologies/nulu-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1
    toolFilter:
      deny: [write, edit, glob, grep, web_search, web_fetch]
