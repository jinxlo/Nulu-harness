# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: plugin-package-inventory
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- id: sandbox
  name: '@worldapptechnologies/nulu-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra

- id: spill-local
  name: '@worldapptechnologies/nulu-spill-local'
  config:
    root: !!js process.env.NULU_SNAPSHOT_SPILL_ROOT ?? './.spill'
    cleanupPeriodDays: 0

- insert:
    - id: session-reference
      name: '@worldapptechnologies/nulu-session-reference'
      config:
        maxReferenceBytes: 360
    - id: reference-source-fixture
      name: ../../../packages/context/session-reference/tests/fixtures/source-session.ts

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.NULU_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.NULU_SNAPSHOT_SPILL_LOCATOR_ROOT
