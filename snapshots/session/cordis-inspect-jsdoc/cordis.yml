# Add PTC mode and Cordis tools to the base spawn/workflow stack, exercising
# all four boundaries in one ACP snapshot.
- id: agent-default-model
  name: '@worldapptechnologies/nulu-agent-default-model'
  config:
    provider: worldapp-gateway
    model: nulu-5-ultra

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: !!js 'process.env.NULU_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@worldapptechnologies/nulu-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@worldapptechnologies/nulu-tools'
  config:
    mode: both

- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@worldapptechnologies/nulu-cordis-host-runner'
    - id: tool-cordis
      name: '@worldapptechnologies/nulu-tool-cordis'
