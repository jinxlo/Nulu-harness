# Keyless PTC mode combines the runtime/registry changes with the
# Nulu-to-replay swap in one profile patch.
- insert:
    - id: literal-sdk
      name: '../../../packages/core/tools/tests/fixtures/literal-sdk.ts'

- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: plugin-package-inventory
  disabled: true

- id: agent-default-model
  name: '@worldapptechnologies/nulu-agent-default-model'
  config:
    provider: worldapp-gateway
    model: nulu-5

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@worldapptechnologies/nulu-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@worldapptechnologies/nulu-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra
