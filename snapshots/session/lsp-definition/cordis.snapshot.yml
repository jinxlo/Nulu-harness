# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- insert:
    - id: lsp
      name: '@worldapptechnologies/nulu-lsp'
    - id: lsp-stdio
      name: '@worldapptechnologies/nulu-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@worldapptechnologies/nulu-tool-lsp'
      config:
        maxLocations: 1
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra

- id: timeout-policy
  name: '@worldapptechnologies/nulu-tool-call-timeout-policy'
