# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: plugin-package-inventory
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- id: sandbox
  name: '@worldapptechnologies/nulu-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: nulu-official
            name: Nulu
            models:
              - id: nulu-v4-flash
              - id: nulu-v4-pro
          - id: nulu-messages
            name: Nulu Messages
            models:
              - id: nulu-v4-flash
              - id: nulu-v4-pro

# Bound foreground preparation before any native process is allocated.
- id: subprocess
  disabled: true

- id: sandbox
  disabled: true

- insert:
    - id: pending-confinement-fixture
      name: '../../../packages/shell/bash-sandbox/tests/fixtures/pending-confinement.ts'
