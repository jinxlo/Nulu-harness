# Keyless replay for the image-compaction scenario. This profile patch swaps
# the adapter and re-pins the recorded vision model. The replay catalog declares image input,
# so the strict read_image gate accepts the route and the tool result carries
# the durable image block.
- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: acp
  name: '@worldapptechnologies/nulu-acp'
  config:
    provider: worldapp-gateway
    model: nulu-5-vision

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js process.env.NULU_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    compression: none

- id: agent-instructions
  name: '@worldapptechnologies/nulu-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
                inputModalities: [text]
              - id: nulu-5-ultra
                inputModalities: [text]
              - id: nulu-5-vision
                inputModalities: [text, image]
                # Route-priced request images at the provider cap; the small
                # context window turns that visual pressure into an automatic
                # compaction the text-only heuristic would not trigger.
                contextWindow: 11600
                imageRequestTokens: 384

- id: attachment-local
  name: '@worldapptechnologies/nulu-attachment-local'

# Tight automatic compaction budget sized to the route-priced visual tokens of
# the scenario's inline images: the text-only history stays under the
# threshold, so a triggered compaction proves the routed model's image pricing
# drove the pressure decision.
- id: compaction-basic
  name: '@worldapptechnologies/nulu-compaction-basic'
  config:
    retainTokens: 100

- insert:
    - name: './summary-image-budget.mjs'
