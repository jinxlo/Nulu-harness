# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- id: acp
  name: '@worldapptechnologies/nulu-acp'
  config:
    provider: worldapp-gateway
    model: nulu-5

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js process.env.NULU_SNAPSHOT_SESSIONS_ROOT ?? nuluHomePath('sessions')
    compression: none

- id: sandbox
  name: '@worldapptechnologies/nulu-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: nulu-5
              - id: nulu-5-ultra

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'

- insert:
    - id: snapshot-shell-path
      name: ../../../scripts/snapshot-shell-path.ts
      config:
        command: "printf 'escalated\\n' > /tmp/nulu-escalated.txt && cat /tmp/nulu-escalated.txt && rm /tmp/nulu-escalated.txt"
        recordedPath: /tmp/nulu-escalated.txt
        livePath: !!js process.env.NULU_SNAPSHOT_SPILL_ROOT + '/nulu-escalated.txt'
