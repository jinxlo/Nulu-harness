# TypeScript SDK snapshot-record patch over `nulu --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@worldapptechnologies/nulu-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: !!js "process.env.NULU_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@worldapptechnologies/nulu-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- insert:
    - id: snapshot-message-feedback
      name: '@worldapptechnologies/nulu-message-feedback'
      disabled: !!js "process.env.NULU_SNAPSHOT_FEEDBACK !== '1'"
      config:
        maxNoteBytes: 1024
    - id: snapshot-feedback-producer
      name: './feedback-producer.mjs'
      disabled: !!js "process.env.NULU_SNAPSHOT_FEEDBACK !== '1'"
