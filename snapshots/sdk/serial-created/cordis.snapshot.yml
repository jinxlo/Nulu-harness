# Keyless TypeScript SDK replay patch over the live profile patch.

- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

- id: session-log-gateway
  name: '@worldapptechnologies/nulu-session-log-gateway'
  config:
    enabled: true
