# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary Nulu route while the every other capability stay
# identical to the base example.
- insert:
    - id: session-title-provider
      name: '@worldapptechnologies/nulu-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: worldapp-gateway
        model: nulu-5
