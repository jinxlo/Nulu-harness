# Keyless replay layer for the ordinary SDK snapshot composition.

- id: llm-gateway
  name: '@worldapptechnologies/nulu-llm-gateway'
  disabled: true

- insert:
    - id: llm-replay
      name: '@worldapptechnologies/nulu-llm-replay'
      config:
        providers:
          - id: worldapp-gateway
            name: Nulu
            models:
              - id: deepseek-v4-flash

- id: session-log-deepseek
  config:
    enabled: false
