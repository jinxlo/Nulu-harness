# SDK-profile patch for the child runtime in the cwd-inheritance proof.

- id: llm-deepseek
  name: '@worldapptechnologies/nulu-llm-deepseek'
  disabled: true

- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'
  config:
    personaPrefix: 'Echo where you run.'

- id: agent-instructions
  name: '@worldapptechnologies/nulu-agent-instructions'
  disabled: true

- id: skill-filesystem
  name: '@worldapptechnologies/nulu-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@worldapptechnologies/nulu-session-persistence-jsonl'
  config:
    root: !!js nuluHomePath('sessions')
    compression: none

- insert:
    - id: child-mock-llm
      name: './child-mock-llm.ts'
