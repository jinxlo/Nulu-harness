# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@worldapptechnologies/nulu-system-prompt'

- id: tools
  name: '@worldapptechnologies/nulu-tools'

- id: subprocess
  name: '@worldapptechnologies/nulu-subprocess-local'

- id: bash
  name: '@worldapptechnologies/nulu-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@worldapptechnologies/nulu-shell-env'

- id: tasks
  name: '@worldapptechnologies/nulu-jobs-local'

- id: tool-jobs
  name: '@worldapptechnologies/nulu-tool-jobs'

- id: tool-pwsh
  name: '@worldapptechnologies/nulu-tool-pwsh'
