# The automation-only ACP application over nulu-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@worldapptechnologies/nulu-acp-app'

    - id: acp
      name: '@worldapptechnologies/nulu-acp'
      inject: [acpAppStartup]
      config:
        provider: worldapp-gateway
        model: nulu-5-ultra
