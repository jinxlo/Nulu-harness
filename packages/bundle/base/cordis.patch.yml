# The nulu-base bundle patch: the shared core of each base-backed profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: timer
      name: '@worldapptechnologies/cordis-plugin-timer'

    # Module reload is opt-in per profile. `patchReload: live` config watching
    # uses the launcher's watch-only fallback and does not require this row.
    - id: hmr
      name: '@worldapptechnologies/cordis-plugin-hmr'
      disabled: true
      config:
        root: ['.']

    - id: llm
      name: '@worldapptechnologies/nulu-llm'

    - id: llm-api-extensions
      name: '@worldapptechnologies/nulu-llm-api-extensions'

    - id: session
      name: '@worldapptechnologies/nulu-session'

    - id: session-log-gateway
      name: '@worldapptechnologies/nulu-session-log-gateway'

    - id: typert
      name: '@worldapptechnologies/nulu-typert-registry'

    - id: typert-loader
      name: '@worldapptechnologies/nulu-typert-loader'

    - id: typert-gateway
      name: '@worldapptechnologies/nulu-api-gateway'

    - id: session-title
      name: '@worldapptechnologies/nulu-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@worldapptechnologies/nulu-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: '@worldapptechnologies/nulu-user-questions'

    - id: agent
      name: '@worldapptechnologies/nulu-agent'

    - id: plugin-package-inventory
      name: '@worldapptechnologies/nulu-plugin-package-inventory'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@worldapptechnologies/nulu-agent-default-model'
      config:
        provider: worldapp
        model: nulu-5-ultra

    - id: jobs
      name: '@worldapptechnologies/nulu-jobs-local'

    - id: llm-retry
      name: '@worldapptechnologies/nulu-llm-retry'

    # User-settings document (`$NULU_HOME/settings.yaml`, hot-reloaded): a
    # `llm-gateway:` or `llm-pi-ai:` section there overrides the adapter entries
    # below without a restart, and is what the web Models page writes.
    - id: settings
      name: '@worldapptechnologies/nulu-settings-file'

    # Credential sources: inherited environment over the managed
    # `$NULU_HOME/.credentials.yaml`, with project and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: credentials
      name: '@worldapptechnologies/nulu-credentials-local'

    # The pi-ai multi-provider router, shipped with the World App Technologies
    # route below because `agent-default-model` selects its `nulu-5-ultra`:
    # requests authenticate from WORLD_APP_TECHNOLOGIES_API_KEY (inherited
    # environment, managed credentials, or a `.env` fallback) with no settings
    # document required. A `llm-pi-ai:` settings section — what the web Models
    # page writes — layers over these profiles per route without a restart.
    # Which adapters exist is composition; which providers run is the user's
    # settings document.
    - id: llm-pi-ai
      name: '@worldapptechnologies/nulu-llm-pi-ai'
      config:
        providers:
          worldapp:
            displayName: World App Technologies
            apiKeyEnv: WORLD_APP_TECHNOLOGIES_API_KEY
            api: openai-completions
            baseURL: https://platform.worldapptechnologies.com/api/v1
            compat:
              # Reasoning wire format the platform endpoint speaks (sends
              # `thinking` and reads `reasoning_content`). A protocol name, not
              # a provider or model reference.
              thinkingFormat: deepseek
              # The platform accepts the system prompt only as `system`.
              supportsDeveloperRole: false
            models:
              - id: nulu-5-ultra
                name: Nulu 5 Ultra
                contextWindow: 1000000
                maxTokens: 384000
                reasoningEfforts:
                  off:
                  low: low
                  medium: medium
                  high: high
                  max: max

    - id: session-persistence-jsonl
      name: '@worldapptechnologies/nulu-session-persistence-jsonl'
      config:
        root: !!js nuluHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@worldapptechnologies/nulu-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@worldapptechnologies/nulu-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: session-projection
      name: '@worldapptechnologies/nulu-session-projection'

    # Durable KV storage: the storage hub, the json backend, and the
    # schema-validated domain form over them. Session-layer persistence (the
    # projection cache below; workspace in web layers)
    # routes through this stack, so it belongs to the shared base.
    - id: storage
      name: '@worldapptechnologies/nulu-storage'

    - id: storage-json
      name: '@worldapptechnologies/nulu-storage-json'
      config:
        root: !!js nuluHomePath('storages')

    - id: storage-domain
      name: '@worldapptechnologies/nulu-storage-domain'
      config:
        backend: json

    # Persisted projection cache: throttled write-behind over the
    # session_projcache domain (per-record layout — one version-stamped
    # checkpoint document per session), serving the session listing's
    # projection column.
    - id: session-projection-cache
      name: '@worldapptechnologies/nulu-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # OTel releases a Session-log prefix only after explicit user feedback,
    # regardless of model provider. Ordinary activity never triggers capture.
    # No collector is assumed: NULU_TELEMETRY_OTLP_URL names one and is the
    # endpoint itself, and an unset value disables the row. A non-empty
    # NULU_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out too (the launchers patch the row disabled; config cannot
    # disable a row). Exports carry the harness home's anonymous user id ($NULU_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. The exporter/processor values normally bound the shutdown drain
    # to ~1s against an unreachable collector: exporter.timeoutMillis is both
    # the per-attempt socket timeout and the retry deadline (1s effectively
    # disables the SDK's 5-try backoff), while maxExportBatchSize == maxQueueSize
    # (both explicit) makes the drain a single batch. The SDK awaits
    # exporter.forceFlush() outside exportTimeoutMillis, so the backend's 3s
    # shutdownTimeoutMillis is the load-bearing outer bound when a transport
    # promise never settles. Every CLI exit path drains it by disposing the root
    # on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: '@worldapptechnologies/nulu-session-telemetry-otel'
      disabled: !!js "!process.env.NULU_TELEMETRY_OTLP_URL"
      config:
        mode: !!js process.env.NULU_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        exporter:
          url: !!js process.env.NULU_TELEMETRY_OTLP_URL
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@worldapptechnologies/nulu-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@worldapptechnologies/nulu-sandbox-local'

    - id: sandbox-policy
      name: '@worldapptechnologies/nulu-sandbox-policy'
      config:
        mode: !!js process.env.NULU_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@worldapptechnologies/nulu-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@worldapptechnologies/nulu-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@worldapptechnologies/nulu-user-approval'
      config:
        policy: !!js "(process.env.NULU_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@worldapptechnologies/nulu-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@worldapptechnologies/nulu-shell-env'

    - id: tool-bash
      name: '@worldapptechnologies/nulu-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@worldapptechnologies/nulu-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@worldapptechnologies/nulu-tool-jobs'

    - id: fs-observation-policy
      name: '@worldapptechnologies/nulu-fs-observation-policy'

    - id: tool-fs
      name: '@worldapptechnologies/nulu-tool-fs'

    - id: tool-fs-search
      name: '@worldapptechnologies/nulu-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@worldapptechnologies/nulu-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@worldapptechnologies/nulu-skill'

    - id: skill-filesystem
      name: '@worldapptechnologies/nulu-skill-filesystem'

    - id: skill-badge
      name: '@worldapptechnologies/nulu-skill-badge'
      disabled: true

    - id: tool-skill
      name: '@worldapptechnologies/nulu-tool-skill'

    - id: commands
      name: '@worldapptechnologies/nulu-commands'

    - id: command-feedback
      name: '@worldapptechnologies/nulu-command-feedback'

    - id: goal
      name: '@worldapptechnologies/nulu-goal'

    - id: goal-round-driver
      name: '@worldapptechnologies/nulu-goal-round-driver'

    - id: command-goal
      name: '@worldapptechnologies/nulu-command-goal'

    - id: plan-mode
      name: '@worldapptechnologies/nulu-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@worldapptechnologies/nulu-token-meter'

    - id: compaction-basic
      name: '@worldapptechnologies/nulu-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@worldapptechnologies/nulu-command-compact'

    - id: subagent
      name: '@worldapptechnologies/nulu-subagent'

    - id: subagent-spawn-in-process
      name: '@worldapptechnologies/nulu-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@worldapptechnologies/nulu-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@worldapptechnologies/nulu-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@worldapptechnologies/nulu-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@worldapptechnologies/nulu-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This base row
    # stays one-shot; preset layers may select continuable mode without adding a
    # child-only system-prompt section or tool schema ahead of that history.
    # See .agents/notes/implemented/feature/2026-08-18-model-selected-subagent-routes.md
    # and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@worldapptechnologies/nulu-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    - id: workflow-worker-thread
      name: '@worldapptechnologies/nulu-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@worldapptechnologies/nulu-tool-workflow'

    - id: timeout-policy
      name: '@worldapptechnologies/nulu-tool-call-timeout-policy'

    - id: spill-local
      name: '@worldapptechnologies/nulu-spill-local'

    - id: spill-policy
      name: '@worldapptechnologies/nulu-spill-policy'
      config:
        maxInlineBytes: 50000

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@worldapptechnologies/nulu-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@worldapptechnologies/nulu-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@worldapptechnologies/nulu-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@worldapptechnologies/nulu-tool-goal'

    # Fresh-agent Ralph iteration over a build-time-fixed script.
    - id: tool-ralph
      name: '@worldapptechnologies/nulu-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@worldapptechnologies/nulu-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # The shared base enables the stable model-facing web_search and web_fetch
    # tools. The Web app disables this host row and composes both tools per agent
    # preset; products with a stricter network policy override tool-web. Nulu
    # search resolves the same WORLD_APP_TECHNOLOGIES_API_KEY
    # credential the Models page manages for chat, at each search; its Messages
    # endpoint is separate from the chat-completions endpoint, so it takes its own
    # base-URL override. Anonymous fetch accepts only public HTTP(S) destinations,
    # resolves and validates every destination, and pins every actual connection.
    # Search is a full auxiliary model request with server-side retrieval, so this
    # shipped Nulu route gets 60s while the provider-neutral tool default
    # remains 30s.
    - id: web
      name: '@worldapptechnologies/nulu-web'
      config:
        searchProvider: worldapp-gateway
        fetchProvider: http

    - id: web-search-gateway
      name: '@worldapptechnologies/nulu-web-search-gateway'
      config:
        apiKeyEnv: WORLD_APP_TECHNOLOGIES_API_KEY

    - id: web-fetch-http
      name: '@worldapptechnologies/nulu-web-fetch-http'

    - id: tool-web
      name: '@worldapptechnologies/nulu-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: '@worldapptechnologies/nulu-tools'

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@worldapptechnologies/nulu-system-prompt'
      config:
        personaPrefix: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@worldapptechnologies/nulu-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@worldapptechnologies/nulu-fs-sandbox'

    # The native Nulu adapter. No key or endpoint is inlined: both resolve per
    # request from the `llm-gateway:` settings section over this entry, with the
    # key coming from the credential store below. Thinking defaults are a deployment
    # choice.
    - id: llm-gateway
      name: '@worldapptechnologies/nulu-llm-gateway'
